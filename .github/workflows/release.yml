name: 🚀 Release

on:
  push:
    branches: [main]

permissions:
  contents: write
  packages: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  semantic-release:
    runs-on: ubuntu-latest
    outputs:
      released: ${{ steps.bootstrap.outputs.released || steps.release.outputs.released }}
      version: ${{ steps.bootstrap.outputs.version || steps.release.outputs.version }}
      tag: ${{ steps.bootstrap.outputs.tag || steps.release.outputs.tag }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Bootstrap initial tag (only on first ever run)
        id: bootstrap
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "$(git tag -l 'v*')" ]; then
            VERSION=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
            # Extract the curated `## v$VERSION` block from CHANGELOG.md as the release body.
            # awk: print lines after the matching `## vX.Y.Z` heading until the next `## v` heading.
            awk -v v="v$VERSION" '
              $0 ~ "^## "v"( |$)" {flag=1; next}
              /^## v/ {flag=0}
              flag {print}
            ' CHANGELOG.md \
              | gh release create "v$VERSION" \
                  --title "v$VERSION" \
                  --notes-file - \
                  --target "$GITHUB_SHA"
            {
              echo "released=true"
              echo "version=$VERSION"
              echo "tag=v$VERSION"
            } >> "$GITHUB_OUTPUT"
          fi

      - name: Run python-semantic-release
        id: release
        if: steps.bootstrap.outputs.released != 'true'
        uses: python-semantic-release/python-semantic-release@350c48fcb3ffcdfd2e0a235206bc2ecea6b69df0  # v10.5.3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}

  docker:
    needs: semantic-release
    if: needs.semantic-release.outputs.released == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.semantic-release.outputs.tag }}

      - uses: docker/setup-qemu-action@ce360397dd3f832beb865e1373c09c0e9f86d70a  # v4.0.0
      - uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5  # v4.1.0

      - uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee  # v4.2.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Metadata (SSE)
        id: meta-sse
        uses: docker/metadata-action@80c7e94dd9b9319bd5eb7a0e0fe9291e23a2a2e9  # v6.1.0
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=${{ needs.semantic-release.outputs.version }}
            type=raw,value=latest

      - name: Build and push SSE image
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf  # v7.2.0
        with:
          context: .
          file: ./Dockerfile
          target: with-volume
          push: true
          platforms: linux/amd64,linux/arm64
          build-args: |
            VERSION=${{ needs.semantic-release.outputs.version }}
            REPO_URL=https://github.com/${{ github.repository }}
          tags: ${{ steps.meta-sse.outputs.tags }}
          labels: ${{ steps.meta-sse.outputs.labels }}

      - name: Metadata (SSE no-volume)
        id: meta-sse-novolume
        uses: docker/metadata-action@80c7e94dd9b9319bd5eb7a0e0fe9291e23a2a2e9  # v6.1.0
        with:
          images: ghcr.io/${{ github.repository }}
          flavor: suffix=-novolume
          tags: |
            type=raw,value=${{ needs.semantic-release.outputs.version }}
            type=raw,value=latest

      - name: Build and push SSE no-volume image
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf  # v7.2.0
        with:
          context: .
          file: ./Dockerfile
          target: no-volume
          push: true
          platforms: linux/amd64,linux/arm64
          build-args: |
            VERSION=${{ needs.semantic-release.outputs.version }}
            REPO_URL=https://github.com/${{ github.repository }}
          tags: ${{ steps.meta-sse-novolume.outputs.tags }}
          labels: ${{ steps.meta-sse-novolume.outputs.labels }}

      - name: Metadata (stdio versioned)
        id: meta-stdio
        uses: docker/metadata-action@80c7e94dd9b9319bd5eb7a0e0fe9291e23a2a2e9  # v6.1.0
        with:
          images: ghcr.io/${{ github.repository }}
          flavor: suffix=-stdio
          tags: |
            type=raw,value=${{ needs.semantic-release.outputs.version }}
            type=raw,value=latest

      - name: Metadata (stdio legacy alias — drop at v1.0.0)
        id: meta-stdio-legacy
        uses: docker/metadata-action@80c7e94dd9b9319bd5eb7a0e0fe9291e23a2a2e9  # v6.1.0
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=stdio

      - name: Build and push stdio image
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf  # v7.2.0
        with:
          context: .
          file: ./Dockerfile.stdio
          push: true
          platforms: linux/amd64,linux/arm64
          build-args: |
            VERSION=${{ needs.semantic-release.outputs.version }}
            REPO_URL=https://github.com/${{ github.repository }}
          tags: |
            ${{ steps.meta-stdio.outputs.tags }}
            ${{ steps.meta-stdio-legacy.outputs.tags }}
          labels: ${{ steps.meta-stdio.outputs.labels }}
