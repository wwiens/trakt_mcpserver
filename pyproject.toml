[project]
name = "trakt-mcp-server"
version = "0.9.0"
description = "Model Context Protocol server bridging AI models with the Trakt.tv API."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "python-dotenv>=1.1.1",
    "httpx>=0.27.0",
    "mcp>=1.10.1",
    "pydantic==2.11.7",
]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["server*", "client*", "models*", "config*", "utils*"]

[tool.semantic_release]
version_toml = ["pyproject.toml:project.version"]
branch = "main"
changelog_file = "CHANGELOG.md"
commit_parser = "angular"
major_on_zero = false
allow_zero_version = true

[tool.semantic_release.changelog]
mode = "update"
insertion_flag = "<!-- version list -->"

[tool.semantic_release.publish]
upload_to_vcs_release = false

[tool.semantic_release.build]
build_command = ""

[tool.semantic_release.commit_parser_options]
allowed_tags = ["feat", "fix", "perf", "refactor", "docs", "test", "chore", "ci", "build", "revert"]
minor_tags = ["feat"]
patch_tags = ["fix", "perf"]

[tool.commitizen]
name = "cz_conventional_commits"
version_provider = "pep621"
tag_format = "v$version"

[tool.ruff]
target-version = "py312"
line-length = 88
exclude = [
    ".git",
    "__pycache__",
    ".venv",
    "venv",
    ".pytest_cache",
]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # Pyflakes
    "I",    # isort
    "B",    # flake8-bugbear
    "C4",   # flake8-comprehensions
    "UP",   # pyupgrade
    "RUF",  # Ruff-specific rules
    "S",    # Security (bandit)
    "SIM",  # Simplify
    "TCH",  # Type checking imports
    "PERF", # Performance
]
ignore = [
    "UP040", # Type alias uses TypeAlias annotation (Python 3.12+ feature)
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = [
    "S101", # Use of assert (legitimate in tests)
    "S105", # Possible hardcoded password (test data)
    "S106", # Possible hardcoded password passed to function (test data)
    "S603", # subprocess call (legitimate in test fixtures)
    "S607", # Starting process with partial executable path (legitimate in tests)
]

"models.py" = [
    "S105", # token_type = "bearer" is legitimate OAuth config
]
"trakt_client.py" = [
    "S105", # AUTH_TOKEN_FILE = "auth_token.json" is legitimate config
]


[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

[tool.pyright]
include = [
    "**/*.py"
]
exclude = [
    "**/__pycache__",
    "**/site-packages/**",
    "**/.venv/**",
    "**/venv/**"
]
pythonVersion = "3.12"
typeCheckingMode = "strict"
useLibraryCodeForTypes = true
reportMissingTypeStubs = "error"
reportUnknownMemberType = "error"
reportUnknownVariableType = "error"
reportUnknownArgumentType = "error"
reportGeneralTypeIssues = "error"
reportOptionalMemberAccess = "error"
reportOptionalSubscript = "error"
reportPrivateImportUsage = "error"
reportUnnecessaryTypeIgnoreComment = "none"
reportUnnecessaryIsInstance = "error"
reportUnnecessaryComparison = "error"
reportConstantRedefinition = "error"
reportIncompatibleMethodOverride = "error"
reportIncompatibleVariableOverride = "error"
reportMissingParameterType = "error"
reportUnusedImport = "error"
reportUnusedVariable = "error"
reportDuplicateImport = "error"
reportWildcardImportFromLibrary = "error"
reportSelfClsParameterName = "error"
reportImplicitStringConcatenation = "error"
reportUndefinedVariable = "error"
reportAssertAlwaysTrue = "error"
reportFunctionMemberAccess = "error"
reportUnusedFunction = "error"
