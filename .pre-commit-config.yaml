repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.12  # keep in lockstep with requirements-dev.txt's `ruff==...` pin
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  - repo: https://github.com/commitizen-tools/commitizen
    rev: v4.15.1  # current latest 4.x; includes CWE-78 shell-injection fix
    hooks:
      - id: commitizen
        stages: [commit-msg]
